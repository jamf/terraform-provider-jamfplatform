# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  
  # Daily, not weekly: jamfplatform-go-sdk carries the Apple schema tables the blueprint
  # resource validates against at plan time, and an unrecognised name there is an error, so a
  # stale SDK blocks configurations Jamf Pro already offers. See CLAUDE.md §Apple profile schemas.
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
